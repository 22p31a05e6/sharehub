spring:
  application:
    name: securehub

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/secure}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/securehub}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:projectnearbuy@gmail.com}
    password: ${MAIL_PASSWORD:jsad krkb ytuj kvuh}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
      mail.smtp.ssl.trust: ${MAIL_SMTP_SSL_TRUST:smtp.gmail.com}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

  mail:
    from: ${MAIL_FROM:projectnearbuy@gmail.com}

  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}

  storage-path: ${STORAGE_PATH:./storage}